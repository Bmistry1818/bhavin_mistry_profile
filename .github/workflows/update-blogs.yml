name: Sync publications and publish site

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-profile-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Shell steps respect the repository's owner-only Actions policy.
      - name: Checkout source
        shell: bash
        run: |
          git init
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Select Node.js
        shell: bash
        run: |
          NODE_RUNTIME_DIR=$(find "$RUNNER_TOOL_CACHE/node" -mindepth 2 -maxdepth 2 -type d -path '*/22.*/x64' | sort -V | tail -1)
          if [ -n "$NODE_RUNTIME_DIR" ]; then
            echo "$NODE_RUNTIME_DIR/bin" >> "$GITHUB_PATH"
          fi

      - name: Install locked dependencies
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) throw Error("Node.js 22+ is required")'
          npx --yes pnpm@11.19.0 install --frozen-lockfile --ignore-scripts

      - name: Refresh publications
        id: feeds
        env:
          LINKEDIN_RSS_URL: ${{ secrets.LINKEDIN_RSS_URL || vars.LINKEDIN_RSS_URL }}
          BLOG_DIAGNOSTICS_FILE: ${{ runner.temp }}/blog-sources.json
        run: node scripts/fetch-blogs.js --restore-published

      - name: Validate and build pages
        run: |
          node --test
          node --check script.js
          node scripts/build-pages.js

      - name: Publish generated site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-pages.js

      - name: Summarize source status
        if: always()
        shell: bash
        run: |
          printf '## Publication sync\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/blog-sources.json" ]; then
            printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/blog-sources.json" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nMedium uses its RSS feed. LinkedIn uses LINKEDIN_RSS_URL when configured; otherwise verified links are retained. Generated pages publish to gh-pages without a pending content pull request.\n' >> "$GITHUB_STEP_SUMMARY"
